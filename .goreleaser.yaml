# Release build: `git tag v2.x.y && git push --tags` runs .github/workflows/release.yml.
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: tracestate

builds:
  - main: ./cmd/tracestate
    binary: tracestate
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Tag }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # No version in the name, so releases/latest/download/<name> is stable
  # (the GitHub Action relies on it).
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^ci", "^chore"]

release:
  footer: |
    Every archive is listed in `checksums.txt` and carries a signed build
    provenance attestation. To verify a download:

        gh attestation verify tracestate_linux_amd64.tar.gz --repo JampaniKomal/TraceState
